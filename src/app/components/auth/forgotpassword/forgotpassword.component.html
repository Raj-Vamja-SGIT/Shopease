<h5>Enter your email id</h5>
<form class="">
  <div class="form-group text-left">
    <input
      type="email"
      id="email"
      class="form-control"
      placeholder="Email address"
    />
  </div>
  <button type="submit" class="btn btn-primary w-100 mb-3">
    Send link to email
  </button>

  <a routerLink="/auth/login" class="text-primary">Back to Login</a>
</form>
