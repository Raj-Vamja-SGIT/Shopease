<app-loader *ngIf="isLoading"></app-loader>
<div class="grid">
    <div class="col-12" [ngClass]="isEdit ? 'md:col-7' : 'md:col-12'">
        <div class="card p-fluid">
            <h5 class="pb-2">General Information</h5>
            <div class="field">
                <label htmlFor="productName">Product Name</label>
                <input
                    pInputText
                    placeholder="Enter Product Name"
                    id="productName"
                    name="productName"
                    [(ngModel)]="ProductDetails.ProductName"
                    #productName="ngModel"
                    type="text"
                />
            </div>
            <div class="field">
                <label htmlFor="productDescription">Descriprion</label>
                <textarea
                    rows="7"
                    cols="30"
                    placeholder="Enter Product Descriprion"
                    pInputTextarea
                    id="productDescription"
                    name="productDescription"
                    [(ngModel)]="ProductDetails.ProductDescription"
                    #productDescription="ngModel"
                ></textarea>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-5" *ngIf="isEdit">
        <div class="card p-fluid" style="height: 354px">
            <h5 class="pb-2">Product Media</h5>
            <div class="container">
                <button
                    pButton
                    pRipple
                    label="Add Product Image"
                    class="p-button-text add-product-button"
                    icon="pi pi-plus"
                    style="width: 40%"
                    (click)="showDialog()"
                ></button>
            </div>
            <p-dialog
                header="Product Images"
                [modal]="true"
                [(visible)]="visible"
                [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
                [style]="{ width: '40vw' }"
                [draggable]="false"
                [resizable]="false"
            >
                <div class="card">
                    <p-fileUpload
                        name="demo[]"
                        url="https://www.primefaces.org/cdn/api/upload.php"
                        (onUpload)="onUpload($event)"
                        (onSelect)="onFileSelect($event)"
                        [multiple]="true"
                        accept="image/*"
                        maxFileSize="10000000"
                    >
                        <ng-template pTemplate="content">
                            <ul *ngIf="uploadedFiles.length">
                                <p-scrollPanel
                                    [style]="{ width: '100%', height: '200px' }"
                                >
                                    <!-- <li *ngFor="let file of uploadedFiles">
                                        {{ file.name }} - {{ file.size }} bytes
                                    </li> -->
                                </p-scrollPanel>
                            </ul>
                        </ng-template>
                    </p-fileUpload>
                    
                </div>
            </p-dialog>
        </div>
    </div>
    <div class="col-12 md:col-7">
        <div class="card p-fluid">
            <h5 class="pb-2">Pricing</h5>
            <div class="field">
                <label htmlFor="price">Base Price</label>
                <p-inputGroup class="w-full">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Price"
                        id="price"
                        name="price"
                        [(ngModel)]="ProductDetails.Price"
                        #price="ngModel"
                    />
                    <p-inputGroupAddon>₹</p-inputGroupAddon>
                </p-inputGroup>
            </div>
            <div class="field">
                <label htmlFor="discount">Discount Percentage (%)</label>
                <p-inputGroup class="w-full">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Discount"
                        id="discount"
                        name="discount"
                        [(ngModel)]="ProductDetails.Discount"
                        #discount="ngModel"
                    />
                    <p-inputGroupAddon>%</p-inputGroupAddon>
                </p-inputGroup>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-5">
        <div class="card p-fluid">
            <h5 class="pb-2">Category</h5>
            <div class="field">
                <label htmlFor="price">Product Category</label>
                <p-dropdown
                    [options]="categories"
                    [(ngModel)]="ProductDetails.Category"
                    optionLabel="categoryName"
                    optionValue="categoryId"
                    [filter]="true"
                    filterBy="categoryName"
                    [showClear]="true"
                    placeholder="Select a Category"
                    name="category"
                    id="category"
                >
                </p-dropdown>
            </div>

            <div class="field">
                <label htmlFor="price">Product Brand</label>
                <p-dropdown
                    [options]="brands"
                    [(ngModel)]="ProductDetails.Brand"
                    optionLabel="brandName"
                    optionValue="brandId"
                    [filter]="true"
                    filterBy="brandName"
                    [showClear]="true"
                    placeholder="Select a Brand"
                    id="brand"
                    name="brand"
                >
                </p-dropdown>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-7">
        <div class="card p-fluid">
            <h5>Inventory Details</h5>
            <div class="grid formgrid">
                <div class="col-12 lg:col-6">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product SKU"
                        id="sku"
                        name="sku"
                        [(ngModel)]="ProductDetails.SKU"
                    />
                </div>
                <div class="col-12 lg:col-6">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Quantity"
                        id="stockStatus"
                        name="stockStatus"
                        [(ngModel)]="ProductDetails.StockStatus"
                    />
                </div>
            </div>
        </div>
    </div>
</div>
