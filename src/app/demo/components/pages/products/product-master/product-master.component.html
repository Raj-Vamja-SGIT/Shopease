<app-loader *ngIf="isLoading"></app-loader>
<div class="grid">
    <div class="col-12" [ngClass]="isEdit ? 'md:col-7' : 'md:col-12'">
        <div class="card p-fluid">
            <h5 class="pb-2">General Information</h5>
            <div class="field">
                <label htmlFor="productName">Product Name</label>
                <input
                    pInputText
                    placeholder="Enter Product Name"
                    id="productName"
                    name="productName"
                    [(ngModel)]="ProductDetails.ProductName"
                    #productName="ngModel"
                    type="text"
                />
            </div>
            <div class="field">
                <label htmlFor="productDescription">Descriprion</label>
                <textarea
                    rows="9"
                    cols="30"
                    placeholder="Enter Product Descriprion"
                    pInputTextarea
                    id="productDescription"
                    name="productDescription"
                    [(ngModel)]="ProductDetails.ProductDescription"
                    #productDescription="ngModel"
                ></textarea>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-5" *ngIf="isEdit">
        <div class="card p-fluid" style="height: 385px">
            <h5 class="pb-2">Product Media</h5>

            <div class="card" style="margin-bottom: 0px;">
                <p-carousel 
                    [value]="oldFiles" 
                    [numVisible]="3" 
                    [numScroll]="3" 
                    [circular]="true" 
                    [responsiveOptions]="responsiveOptions" 
                    autoplayInterval="3000">
                    <ng-template let-file pTemplate="item">
                        <div class="border-1 surface-border border-round m-2 p-3">
                                <div class="mb-3">
                                    <div class="relative mx-auto">
                                        <img 
                                            src="{{ file.url }}" 
                                            [alt]="file.name" 
                                            class="w-full border-round" />                                        
                                    </div>
                                </div>
                                <!-- <div class="mb-3 font-medium">
                                    {{ file.name }}
                                </div> -->
                            </div>
                        </ng-template>
                </p-carousel>
            </div>

            <div class="container stickybottom">
                <button
                    pButton
                    pRipple
                    label="Add Product Image"
                    class="p-button-text add-product-button mt-2"
                    icon="pi pi-plus"
                    style="width: 40%"
                    (click)="showDialog()"
                ></button>
            </div>
            <p-dialog
                header="Product Images"
                [modal]="true"
                [(visible)]="visible"
                [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
                [style]="{ width: '40vw' }"
                [draggable]="false"
                [resizable]="false"
            >
                <div class="card">
                    <!-- <p-fileUpload
                        name="demo[]"
                        url="https://www.primefaces.org/cdn/api/upload.php"
                        (onUpload)="onUpload($event)"
                        (onSelect)="onFileSelect($event)"
                        [multiple]="true"
                        accept="image/*"
                        maxFileSize="10000000"
                    >
                        <ng-template pTemplate="content">
                            <ul *ngIf="uploadedFiles.length">
                                <p-scrollPanel
                                    [style]="{ width: '100%', height: '200px' }"
                                >
                                    <li *ngFor="let file of uploadedFiles">
                                        {{ file.name }} - {{ file.size }} bytes
                                    </li>
                                </p-scrollPanel>
                            </ul>
                        </ng-template>
                    </p-fileUpload> -->

                    <div
                        class="dropzone"
                        (drop)="onDrop($event)"
                        (dragover)="onDragOver($event)"
                        (dragleave)="onDragLeave($event)"
                        (click)="fileInput.click()"
                    >
                        <p>
                            Drag and drop files here, or click to select files
                        </p>
                        <input
                            #fileInput
                            type="file"
                            (change)="onFileChange($event)"
                            multiple
                            hidden
                        />
                    </div>

                    <!-- Preview for Newly Uploaded Files -->
                    <div
                        *ngIf="selectedFiles.length > 0"
                        class="preview-container"
                    >
                        <h4>New Files</h4>
                        <div
                            class="file-preview"
                            *ngFor="let file of selectedFiles; let i = index"
                        >
                            <img
                                *ngIf="file.preview"
                                [src]="file.preview"
                                alt="Preview"
                            />
                            <p>{{ file.name }}</p>
                            <!-- <button class="delete-btn" (click)="removeNewFile(i)">Delete</button> -->
                            <i
                                class="pi pi-trash"
                                (click)="removeNewFile(i)"
                                style="
                                    font-size: 1.2rem;
                                    color: red;
                                    cursor: pointer;
                                    padding-right: 2%;
                                "
                            ></i>
                        </div>
                    </div>

                    <div
                        class="mt-5"
                        style="display: flex; justify-content: center"
                        *ngIf="selectedFiles.length > 0"
                    >
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-upload"
                            class="p-button-rounded p-button-outlined"
                            (click)="onUploadFile(selectedFiles)"
                        ></button>
                    </div>

                    <!-- Display Old Files -->
                    <div *ngIf="oldFiles.length > 0" class="preview-container">
                        <h4>Existing Files</h4>
                        <div
                            class="file-preview"
                            *ngFor="let file of oldFiles; let i = index"
                        >
                            <img [src]="file.url" alt="Preview" />
                            <p>{{ file.name }}</p>
                            <!-- <button class="delete-btn" (click)="removeOldFile(file.id, i)">Delete</button> -->
                            <i
                                class="pi pi-trash"
                                (click)="removeOldFile(file.id, i)"
                                style="
                                    font-size: 1.2rem;
                                    color: red;
                                    cursor: pointer;
                                    padding-right: 2%;
                                "
                            ></i>
                        </div>
                    </div>
                </div>
            </p-dialog>
        </div>
    </div>
    <div class="col-12 md:col-7">
        <div class="card p-fluid">
            <h5 class="pb-2">Pricing</h5>
            <div class="field">
                <label htmlFor="price">Base Price</label>
                <p-inputGroup class="w-full">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Price"
                        id="price"
                        name="price"
                        [(ngModel)]="ProductDetails.Price"
                        #price="ngModel"
                    />
                    <p-inputGroupAddon>₹</p-inputGroupAddon>
                </p-inputGroup>
            </div>
            <div class="field">
                <label htmlFor="discount">Discount Percentage (%)</label>
                <p-inputGroup class="w-full">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Discount"
                        id="discount"
                        name="discount"
                        [(ngModel)]="ProductDetails.Discount"
                        #discount="ngModel"
                    />
                    <p-inputGroupAddon>%</p-inputGroupAddon>
                </p-inputGroup>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-5">
        <div class="card p-fluid">
            <h5 class="pb-2">Category</h5>
            <div class="field">
                <label htmlFor="price">Product Category</label>
                <p-dropdown
                    [options]="categories"
                    [(ngModel)]="ProductDetails.Category"
                    optionLabel="categoryName"
                    optionValue="categoryId"
                    [filter]="true"
                    filterBy="categoryName"
                    [showClear]="true"
                    placeholder="Select a Category"
                    name="category"
                    id="category"
                >
                </p-dropdown>
            </div>

            <div class="field">
                <label htmlFor="price">Product Brand</label>
                <p-dropdown
                    [options]="brands"
                    [(ngModel)]="ProductDetails.Brand"
                    optionLabel="brandName"
                    optionValue="brandId"
                    [filter]="true"
                    filterBy="brandName"
                    [showClear]="true"
                    placeholder="Select a Brand"
                    id="brand"
                    name="brand"
                >
                </p-dropdown>
            </div>
        </div>
    </div>
    <div class="col-12 md:col-7">
        <div class="card p-fluid">
            <h5>Inventory Details</h5>
            <div class="grid formgrid">
                <div class="col-12 lg:col-6">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product SKU"
                        id="sku"
                        name="sku"
                        [(ngModel)]="ProductDetails.SKU"
                    />
                </div>
                <div class="col-12 lg:col-6">
                    <input
                        type="text"
                        pInputText
                        placeholder="Enter Product Quantity"
                        id="stockStatus"
                        name="stockStatus"
                        [(ngModel)]="ProductDetails.StockStatus"
                    />
                </div>
            </div>
        </div>
    </div>
</div>
