<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toast></p-toast>
            <app-loader *ngIf="isLoading"></app-loader>
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left">
                    <div class="my-2">
                        <button pButton pRipple label="Export" icon="pi pi-upload" class="p-button-help" (click)="dt.exportCSV()"></button>
                    </div>
                </ng-template>

                <ng-template pTemplate="right">
                    <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
                </ng-template>
            </p-toolbar>
            <p-table #dt [value]="subCategory" [columns]="cols" responsiveLayout="scroll" [rows]="5" [globalFilterFields]="['subCategoryName']" [paginator]="true" [rowsPerPageOptions]="[5,10,20]" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [(selection)]="selectedSubCategories" selectionMode="multiple" [rowHover]="true" dataKey="subCategoryId">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Manage Sub Categories</h5>
                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..."  class="w-full sm:w-auto"/>
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 3rem">
                            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                        </th>
                        <th pSortableColumn="subCategoryName">Sub Category <p-sortIcon field="subCategoryName"></p-sortIcon></th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-subCategory>
                    <tr>
                        <td>
                            <p-tableCheckbox [value]="subCategory" (click)="onActiveDeactive(selectedSubCategories)"></p-tableCheckbox>
                        </td>
                        <td style="width:100%; min-width:15rem;"><span class="p-column-title">Sub Category</span>
                            {{subCategory.subCategoryName}}
                        </td>
                        <td>
                            <div class="flex" style="float: right;">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-success mr-2" (click)="editSubCategory(subCategory.subCategoryId)"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-text p-button-warning" (click)="deleteUser()"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>

            </p-table>
        </div>
        <form #subCategoryDetailsForm="ngForm" (ngSubmit)="onSubmit(subCategoryDetailsForm)">
        <p-dialog [(visible)]="subCategoryDialog" [style]="{width: '450px', height: '500px'}" header="Sub Category Details" [modal]="true" class="p-fluid">
                <ng-template pTemplate="content">
                    <div class="field" *ngIf="!isLoading">
                        <label htmlFor="price">Product Category</label>
                        <p-dropdown
                            [options]="categories"
                            [(ngModel)]="subCategoryDetails.categoryId"
                            optionLabel="categoryName"
                            optionValue="categoryId"
                            [filter]="true"
                            filterBy="categoryName"
                            [showClear]="true"
                            placeholder="Select a Category"
                            name="categoryId"
                            id="categoryId"
                            #category="ngModel"
                            required
                        >
                        </p-dropdown>
                        <div
                            *ngIf="
                                category.invalid &&
                                (category.dirty || category.touched)
                            "
                            class="error-messages"
                        >
                            <div *ngIf="category.errors?.required">
                                Product category is required.
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label htmlFor="subCategoryName">Sub Category</label>
                        <input 
                            pInputText 
                            type="text" 
                            id="subCategoryName" 
                            name="subCategoryName" 
                            placeholder="Enter Sub Category Name"
                            [(ngModel)]="subCategoryDetails.subCategoryName"
                            #subCategoryName="ngModel"
                            required
                        />
                        <div
                        *ngIf="
                            subCategoryName.invalid &&
                            (subCategoryName.dirty || subCategoryName.touched)
                        "
                        class="error-messages"
                    >
                        <div *ngIf="subCategoryName.errors?.required">
                            Sub Category is required.
                        </div>
                    </div>
                    </div>
                </ng-template>
                <ng-template pTemplate="footer">
                    <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
                    <button pButton pRipple label="Save" type="submit" icon="pi pi-check" class="p-button-text p-button-success"></button>
                </ng-template>
            </p-dialog>
        </form>

        <!-- <p-dialog [(visible)]="deleteUserDialog" header="Confirm" [modal]="true" [style]="{width:'450px'}">
            <div class="flex align-items-center justify-content-center" style=" margin-right: 1rem;">
                <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
                <span *ngIf="user">Are you sure you want to delete <b>{{user.userName}}</b>?</span>
            </div>
            <ng-template pTemplate="footer">
                <button pButton pRipple icon="pi pi-times" class="p-button-text" label="No" (click)="deleteUserDialog = false"></button>
                <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Yes" (click)="confirmDelete()"></button>
            </ng-template>
        </p-dialog> -->
     </div>
</div>
